
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan Your Journey | Infinita Hilaria</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            infinita <span>hilaria.</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#destinations">Destinations</a>
        </nav>

        <a href="index.html" class="nav-button">← Back Home</a>
    </header>

    <main class="planner-page">
        <section class="planner-heading">
            <p class="eyebrow">✦ YOUR NEXT ADVENTURE</p>

            <h1>Let's plan something<br>
                <span>beautiful.</span>
            </h1>

            <p>Tell us a little about your dream trip.</p>
        </section>

        <form class="trip-form" id="tripForm">

            <div class="form-group">
                <label for="destination">Where do you want to go?</label>
                <input
                    type="text"
                    id="destination"
                    placeholder="e.g. Ooty, Goa, Bali..."
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">Departure date</label>
                    <input type="date" id="startDate" required>
                </div>

                <div class="form-group">
                    <label for="endDate">Return date</label>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="travellers">Number of travellers</label>
                    <select id="travellers" required>
                        <option value="1">1 traveller</option>
                        <option value="2" selected>2 travellers</option>
                        <option value="3">3 travellers</option>
                        <option value="4">4 travellers</option>
                        <option value="5">5 travellers</option>
                        <option value="6">6 travellers</option>
                        <option value="7">7 travellers</option>
                        <option value="8">8+ travellers</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget">Total budget (₹)</label>
                    <input
                        type="number"
                        id="budget"
                        placeholder="e.g. 10000"
                        min="1"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="travelStyle">Your travel style</label>
                <select id="travelStyle" required>
                    <option value="Nature">Nature & mountains</option>
                    <option value="Adventure">Adventure & activities</option>
                    <option value="Beach">Beach & relaxation</option>
                    <option value="Culture">Culture & heritage</option>
                    <option value="Food">Food & local experiences</option>
                    <option value="Mixed" selected>A little bit of everything</option>
                </select>
            </div>

            <button type="submit" class="primary-button form-button">
                Create My Trip ↗
            </button>

            <p class="form-note">
                Your next unforgettable memory starts here.
            </p>

        </form>

        <section id="tripResult" class="trip-result" hidden></section>
    </main>

    <footer>
        <a href="index.html" class="logo">
            infinita <span>hilaria.</span>
        </a>
        <p>Your Journey, Without Limits.</p>
        <p>© 2026 Infinita Hilaria</p>
    </footer>

    <script src="planner.js"></script>
</body>
</html>
